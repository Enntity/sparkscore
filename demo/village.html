<!-- The village: the ant farm in 3D. It opens on one villager waking up at home, follows her
     out of the door, then pulls back until the whole village is in view. Every move of every
     villager is a live SparkScore decision. Serve with demo/serve.py and open /village.html
     (?n=villagers&k=villagers per pass&skip=1 to start at the wide view).
     The village can be given a charter (demo/laws/charter.md), sent once as a knowledge pack and
     named by every later request; one of its rules can be rewritten from the panel.
     ?demo=1 plays the opening and three town-crier announcements by itself; ?demo=law&skip=1
     plays the charter sequence. Both set window.__demoDone when finished, for recording. -->

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const Q = new URLSearchParams(location.search);
const N = +(Q.get("n") || 300), K = +(Q.get("k") || 16);

const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

// =============================================================== the village
// A place has a centre, a building footprint (hw, hd half-sizes; 0 for open ground) and a

const PLACES = {

const ACTIONS = {
  work:  { say: "go to their job", color: 0xffc23d, verb: "working", icon: "🔨" },
  eat:   { say: "have a meal at the tavern", color: 0xff9d5c, verb: "eating", at: "tavern", icon: "🍲" },

  hide:  { say: "lock themselves in at home", color: 0x9aa3c7, verb: "hiding", icon: "🚪" },

  flee:  { say: "run away to the forest", color: 0xff5fd2, verb: "fleeing", at: "forest", icon: "🏃" },
  party: { say: "celebrate in the square", color: 0xffe45c, verb: "celebrating", at: "square", icon: "🎉" },
  // Offered only to the household the camera opens on.
  breakfast: { say: "eat at home with the family", color: 0xffb37a, verb: "eating", icon: "🥣" },
  talk:  { say: "talk with the family at home", color: 0x7fe0ff, verb: "talking", icon: "💬" },
};
const HOME_ONLY = new Set(["sleep", "hide", "breakfast", "talk"]);
const KEYS = ["work", "eat", "sleep", "chat", "hide", "look", "help", "flee", "party"];
const HOME_KEYS = [...KEYS, "breakfast", "talk"];
const crit = (keys) => Object.fromEntries(keys.map((k) => [k, null]));
const CRITERIA = crit(KEYS), HOME_CRITERIA = crit(HOME_KEYS);
const ROLES = [
  ["farmer", "farm", 5, 0x6a9a3b], ["miller", "mill", 2, 0xd9c7a0], ["blacksmith", "forge", 2, 0x5a5f6b], ["baker", "bakery", 2, 0xf2e6d0], ["fisher", "lake", 2, 0x3b8fb8],
  ["merchant", "market", 3, 0xa8459a], ["guard", "gate", 2, 0xb5362d], ["priest", "chapel", 1, 0x2d2a3a], ["innkeeper", "tavern", 1, 0xc9792d], ["bard", "tavern", 1, 0x2fb3a0],
  ["schoolchild", "school", 3, 0xf0c33c], ["teacher", "school", 1, 0x7a5cc4], ["elder", null, 2, 0x8b7d6b],
];
const TRAITS = ["brave", "timid", "greedy", "kind", "lazy", "curious", "devout", "cheerful", "grumpy", "hard-working", "cautious", "reckless", "shy", "sociable"];
const NAMES = ("Tomas Elin Bram Odette Garrick Isolde Wren Alaric Hilda Perrin Sunniva Cedric Maud Jorah Tilda Osric Linnea Hugh Agnes Rolf Petra Emeric Ysolt Dunstan Greta Faron Lisbet Anselm Brida " +
  "Corwin Edda Lukas Marga Niall Orla Piers Runa Stellan Thea Ulric Vesna Wilmar Yara Zane Alba Beric Clara Dain Esme Finn Gwen Harl Ines Joss Kira Leif Mina Nico Olwen Pell Quill Rhea Sten Tove " +
  "Aldous Bettina Caspian Delphine Ewan Frida Godric Henna Ivo Jessamy Kester Lorna Merrick Nesta Oswin Prudence Quentin Rosalind Silas Tamsin Urien Viola Wystan Xanthe Yorick Zelda Ansel Blythe " +
  "Crispin Dorcas Eamon Fenella Gideon Hester Ingram Juno Kenelm Lavinia Magnus Nerys Orson Philippa Rafe Sabine Thaddeus Una Vaughn Winifred Alder Briar Cato Dulcie Elric Fleur Gareth Honor").split(" ");

// The house the camera opens on: open at the top, low walls on the camera side.
const H = { x: -8, z: 25, w: 11, d: 8 };
const BEDS = [[-4.3, 0], [-2.9, 1], [0.2, 2], [3.6, 3]];        // x offset of each bed, who sleeps in it
const SEATS = [[1.3, 1.5], [3.9, 1.5], [2.6, 0.5], [2.6, 2.6]];
const DOOR_X = -3.2;
const doorIn = { x: H.x + DOOR_X, z: H.z + H.d / 2 - 0.9 }, doorOut = { x: H.x + DOOR_X, z: H.z + H.d / 2 + 1.4 };
const inHouse = (x, z) => Math.abs(x - H.x) < H.w / 2 && Math.abs(z - H.z) < H.d / 2;

const homes = [];

// ---- light follows the clock

for (const [label, text, place] of [["Fire", "Fire at the mill! Bring buckets!", "mill"], ["Dragon", "A dragon is circling over the lake!", "lake"],

}

// click a villager to see their last decision
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = [0, 0];

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function director() {
  const box = $("crierIn"), bar = $("crier");
  const beats = [["Fire at the mill! Bring buckets!", "Nobody scripted this. Every villager decides alone."],
    ["A dragon is circling over the lake!", () => `${Math.round(msEach)} milliseconds a decision. One DGX Spark.`],
    ["Free cider and music in the square, right now!", "Tell them anything. They work it out."]];
  await wait(2200);
  for (const [text, line] of beats) {
    bar.classList.add("typing"); box.value = ""; await wait(500);
    for (const ch of text) { box.value += ch; await wait(38 + Math.random() * 40); }
    await wait(550); bar.classList.remove("typing"); announce(text, null);
    await wait(7000); say(typeof line === "function" ? line() : line, 6500);
    await wait(10500); box.value = "";
  }
  $("endLine").textContent = `${N} villagers · one DGX Spark · ${Math.round(msEach)} ms a decision`;
  $("end").classList.remove("hide"); $("told").classList.add("hide"); $("caption").style.opacity = 0;

for (const [name, label] of [["", "No charter"], ["charter", "Charter"], ["edit", "Charter, rule 1.5 edited"]]) {

}

let last = performance.now();
